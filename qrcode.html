<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>焰厨 - 点餐二维码</title>
  <style>
    *{box-sizing:border-box}
    body{
      font-family:'PingFang SC','Microsoft YaHei',sans-serif;
      margin:0;min-height:100vh;
      background:#fefaf5;
      background-image:
        radial-gradient(ellipse 500px 200px at 50% 0%, rgba(232,69,45,0.06) 0%, transparent 60%),
        url("data:image/svg+xml,%3Csvg width='100' height='100' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23e8ddd0'%3E%3Cpath d='M48 92 Q50 70 44 55 Q38 40 42 25 Q44 40 40 50 Q36 60 38 78 Z' opacity='0.5'/%3E%3Cpath d='M52 92 Q50 68 56 52 Q62 36 58 20 Q56 36 60 48 Q64 62 62 80 Z' opacity='0.5'/%3E%3C/g%3E%3C/svg%3E");
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:30px 20px;text-align:center;color:#2c2c2c;
    }
    h1{font-size:26px;font-weight:900;color:#e8452d;margin:0 0 4px}
    .sub{font-size:14px;color:#999;margin:0 0 24px}
    .qr-box{
      background:#fff;padding:24px;border-radius:20px;
      box-shadow:0 4px 24px rgba(0,0,0,0.08);
      margin-bottom:16px;
    }
    #qrCode{display:block;width:260px;height:260px}
    .url-text{
      font-size:12px;color:#bbb;word-break:break-all;
      max-width:300px;line-height:1.5;
    }
    .tip{
      margin-top:20px;font-size:13px;color:#bbb;
      background:#fff;padding:8px 20px;border-radius:20px;
      box-shadow:0 2px 8px rgba(0,0,0,0.04);
    }
    @media print{
      body{background:#fff}
      .url-text,.tip{display:none}
      .qr-box{box-shadow:none;padding:0}
    }
  </style>
</head>
<body>
  <h1>焰厨</h1>
  <p class="sub">微信扫一扫 · 即刻点餐</p>
  <div class="qr-box"><canvas id="qrCode"></canvas></div>
  <p class="url-text" id="urlDisplay"></p>
  <p class="tip">📱 打印张贴在餐桌上，顾客扫码即可浏览菜单下单</p>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js"></script>
  <script>
    // 菜单页面地址（顾客扫码后打开的页面）
    const MENU_URL = 'https://img-blink-mariah-bought.trycloudflare.com/';
    document.getElementById('urlDisplay').textContent = MENU_URL;
    if (window.QRCode) {
      QRCode.toCanvas(document.getElementById('qrCode'), MENU_URL, {
        width: 260,
        color: { dark: '#c0392b', light: '#ffffff' }
      });
    }
  </script>
</body>
</html>
