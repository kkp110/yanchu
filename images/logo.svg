<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160">
  <defs>
    <linearGradient id="fire1" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#c0392b"/>
      <stop offset="40%" stop-color="#e8452d"/>
      <stop offset="75%" stop-color="#f06543"/>
      <stop offset="100%" stop-color="#ff8c42"/>
    </linearGradient>
    <linearGradient id="fire2" x1="0.7" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#a93226"/>
      <stop offset="40%" stop-color="#d4412e"/>
      <stop offset="75%" stop-color="#ec5e3d"/>
      <stop offset="100%" stop-color="#ff7b3d"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="15%" stop-color="rgba(232,69,45,0.3)"/>
      <stop offset="50%" stop-color="rgba(232,69,45,0.6)"/>
      <stop offset="85%" stop-color="rgba(232,69,45,0.3)"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>
    <filter id="softShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#e8452d" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- 底部装饰线 -->
  <line x1="60" y1="140" x2="340" y2="140" stroke="url(#lineGrad)" stroke-width="2"/>

  <!-- 小火焰装饰 - 左 -->
  <path d="M90,135 Q84,118 88,108 Q90,115 92,122 Q94,113 92,108 Q94,117 96,124 Q98,116 96,110 Q98,118 100,128 Q102,136 96,140 Z" fill="#e8452d" opacity="0.15"/>

  <!-- 小火焰装饰 - 右 -->
  <path d="M290,135 Q284,118 288,108 Q290,115 292,122 Q294,113 292,108 Q294,117 296,124 Q298,116 296,110 Q298,118 300,128 Q302,136 296,140 Z" fill="#e8452d" opacity="0.15"/>

  <!-- "焰" -->
  <text x="105" y="112" text-anchor="middle" font-size="70" font-weight="900" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" fill="url(#fire1)" filter="url(#softShadow)">焰</text>

  <!-- "厨" -->
  <text x="275" y="112" text-anchor="middle" font-size="70" font-weight="900" font-family="'PingFang SC','Microsoft YaHei','SimHei',sans-serif" fill="url(#fire2)" filter="url(#softShadow)">厨</text>
</svg>
