<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>菜单后台 - 焰厨</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .tabs{display:flex;gap:4px;padding:12px 16px 0;max-width:900px;margin:0 auto}
    .tab-btn{padding:10px 20px;border:0;border-radius:10px 10px 0 0;background:#f0ebe4;color:#999;cursor:pointer;font-size:0.9rem}
    .tab-btn.active{background:#e0d8d0;color:var(--text)}
    .tab-content{display:none}
    .tab-content.active{display:block}
    .qr-upload-section{text-align:center;padding:16px 0}
    .qr-upload-section img{max-width:200px;border-radius:12px;margin:10px 0;border:2px solid #e0d8d0}
    .order-item{background:#fafafa;border:1px solid #f0ebe4;border-radius:10px;padding:14px;margin-bottom:10px}
    .order-item .order-header{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px}
    .order-item .order-id{font-size:0.78rem;color:#aaa}
    .order-item .order-total{font-weight:700;color:var(--accent);font-size:1.1rem}
    .order-item .order-meta{font-size:0.82rem;color:#999;margin-top:4px}
    .order-item .order-dishes{font-size:0.85rem;color:#555;margin-top:8px;padding-left:16px}
    .order-item .order-status{display:inline-block;padding:3px 10px;border-radius:999px;font-size:0.75rem}
    .status-done{background:rgba(40,167,69,0.2);color:#5cb85c}
    .status-new{background:rgba(255,193,7,0.2);color:#ffc107}
    #orderListContainer{max-height:400px;overflow-y:auto}
    .btn-done,.btn-cancel,.btn-del{padding:6px 14px;border-radius:14px;border:0;font-size:13px;font-weight:600;cursor:pointer}
    .btn-done{background:#e8f5e9;color:#2e7d32}
    .btn-cancel{background:#fff3e0;color:#e65100}
    .btn-del{background:#fbe9e7;color:#c62828}
    .btn-done:active,.btn-cancel:active,.btn-del:active{opacity:0.7}
    .voice-status{position:fixed;bottom:80px;right:20px;z-index:200;background:#fff;padding:8px 14px;border-radius:20px;box-shadow:0 2px 12px rgba(0,0,0,0.1);font-size:12px;color:#999;display:none}
    @media (max-width:500px){
      .admin-panel{grid-template-columns:1fr}
      .order-item .order-header{flex-direction:column;align-items:flex-start}
      .voice-btn{font-size:12px!important;padding:8px 14px!important}
    }
  </style>
</head>
<body>
  <header class="site-header">
    <div class="logo" style="width:140px;height:56px;"><img src="images/logo.svg" alt="焰厨" /></div>
    <p class="subtitle">后台管理 — 菜品管理 · 订单查看 · 语音播报</p>
  </header>

  <main>
    <div class="tabs">
      <button class="tab-btn active" data-tab="tab-menu">菜品管理</button>
      <button class="tab-btn" data-tab="tab-orders">订单查看</button>
    </div>

    <!-- 菜品管理 -->
    <div id="tab-menu" class="tab-content active">
      <section class="mgmt-section">
        <!-- 表单卡片 -->
        <div class="mgmt-form-card" id="formCard">
          <div class="mgmt-form-header">
            <h2 id="formTitle">➕ 添加菜品</h2>
            <button id="cancelEditBtn" style="display:none;background:none;border:0;color:#999;font-size:14px;cursor:pointer">取消</button>
          </div>
          <form id="itemForm">
            <div class="mgmt-form-row">
              <div class="mgmt-field flex-2">
                <label>菜名</label>
                <input name="name" placeholder="输入菜名" required />
              </div>
              <div class="mgmt-field flex-1">
                <label>价格（元）</label>
                <input name="price" type="number" min="1" step="1" placeholder="0" required />
              </div>
            </div>
            <div class="mgmt-form-row">
              <div class="mgmt-field flex-1">
                <label>分类</label>
                <input name="category" placeholder="热菜、冷盘、干锅等" />
              </div>
              <div class="mgmt-field flex-1">
                <label>状态</label>
                <select name="availableToday">
                  <option value="true">✅ 今日有货</option>
                  <option value="false">❌ 今日售罄</option>
                </select>
              </div>
            </div>
            <div class="mgmt-field">
              <label>描述</label>
              <textarea name="desc" rows="2" placeholder="简短描述口味特色"></textarea>
            </div>
            <div class="mgmt-field">
              <label>菜品图片</label>
              <div class="img-upload-row" style="flex-wrap:wrap;gap:8px">
                <label for="imageInput" class="camera-btn">📷 拍照</label>
                <label for="imageInput2" class="camera-btn" style="background:#e3f2fd;border-color:#90caf9;color:#1976d2">🖼 相册</label>
                <input id="imageInput" type="file" accept="image/*" capture="environment" style="display:none" />
                <input id="imageInput2" type="file" accept="image/*" style="display:none" />
                <input id="imageUrl" type="text" placeholder="或粘贴图片网址" style="flex:1;min-width:140px;padding:10px 12px;border-radius:10px;border:1px solid #e0d8d0;font-size:13px;background:#fafafa" />
                <button type="button" id="loadUrlBtn" class="camera-btn" style="background:#fff3e0;border-color:#ffcc80;color:#e65100">🌐 加载</button>
              </div>
              <img id="imgPreview" class="img-preview" style="display:none;width:100px;height:75px;object-fit:cover;border-radius:8px;border:1px solid #eee;margin-top:8px" />
              <span id="imgName" style="font-size:12px;color:#999"></span>
            </div>
            <button type="submit" class="mgmt-submit">💾 保存菜品</button>
          </form>
        </div>

        <!-- 菜品列表 -->
        <div class="mgmt-list-card">
          <div class="mgmt-list-header">
            <h2>📋 菜品列表 <span id="dishCount" style="font-size:14px;color:#999;font-weight:400"></span></h2>
          </div>
          <div id="itemList"></div>
        </div>
      </section>
    </div>

    <!-- 订单查看 -->
    <div id="tab-orders" class="tab-content">
      <section style="max-width:900px;margin:0 auto;padding:12px 16px">
        <div class="panel-card admin-card">
          <div style="display:flex;justify-content:space-between;align-items:center">
            <h2>订单列表</h2>
            <button id="refreshOrders" style="background:var(--accent);color:var(--text);border:0;padding:6px 14px;border-radius:6px;cursor:pointer">刷新</button>
          </div>
          <div id="orderListContainer"></div>
        </div>
      </section>
    </div>

    <a class="admin-link" href="index.html" style="display:block;text-align:center;margin:20px 0">返回菜单页面</a>
  </main>

  <script src="admin.js" defer></script>
</body>
</html>
